<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <style>
        /* 全局样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 页面背景与居中布局 */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 注册卡片容器 */
        .register-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin: 20px;
            /* 防止手机端贴边 */
        }

        /* 标题样式 */
        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .register-header p {
            color: #666;
            font-size: 14px;
        }

        /* 表单元素样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #764ba2;
        }

        /* 按钮样式 */
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* 底部链接样式 */
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .footer-links a {
            color: #764ba2;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-container">
        <div class="register-header">
            <h2>创建账户</h2>
            <p>请填写以下信息完成注册</p>
        </div>

        <form id="registerForm" onsubmit="return handleRegister(event)">
            <!-- 用户名 -->
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
            </div>

            <!-- 邮箱 -->
            <div class="form-group">
                <label for="email">电子邮箱</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <!-- 密码 -->
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required minlength="6">
            </div>

            <!-- 确认密码 -->
            <div class="form-group">
                <label for="confirm-password">确认密码</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入密码" required>
            </div>

            <!-- 注册按钮 -->
            <button type="submit" class="submit-btn">立即注册</button>
        </form>

        <div class="footer-links">
            <p>已有账号？ <a href="#">直接登录</a></p>
        </div>
    </div>

    <script>
        // 简单的表单验证逻辑
        function handleRegister(event) {
            event.preventDefault(); // 阻止表单默认提交行为

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert("两次输入的密码不一致，请重新输入！");
                return false;
            }

            // 这里可以添加发送到后端的代码
            alert("注册成功！(模拟)");
            console.log("提交的数据:", {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password
            });
        }
    </script>
</body>

</html>
