<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用 - 系统首页</title>
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            /* 保持背景一致 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* 中心卡片容器 */
        .home-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            /* 比登录页宽一点 */
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            margin: 20px;
        }

        /* 图标与标题 */
        .logo-area {
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 60px;
            color: #764ba2;
            margin-bottom: 15px;
        }

        .home-container h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        .home-container p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* 按钮组区域 */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            /* 按钮之间的间距 */
        }

        /* 按钮通用样式 */
        .btn {
            display: inline-block;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            min-width: 140px;
        }

        /* 登录按钮样式 (实心渐变) */
        .btn-login {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.4);
        }

        /* 注册按钮样式 (空心描边) */
        .btn-register {
            background-color: transparent;
            color: #764ba2;
            border: 2px solid #764ba2;
        }

        .btn-register:hover {
            background-color: #f4f0ff;
            transform: translateY(-2px);
        }

        /* 响应式调整 */
        @media (max-width: 480px) {
            .action-buttons {
                flex-direction: column;
                /* 手机上按钮垂直排列 */
                gap: 15px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="home-container">
        <div class="logo-area">
            <i class="fa-solid fa-layer-group logo-icon"></i>
            <h1>欢迎来到我们的平台</h1>
            <p>这是一个简洁、现代的系统演示首页。<br>请选择下方操作以继续访问系统功能。</p>
        </div>

        <div class="action-buttons">
            <!-- 登录链接 -->
            <a href="Login.html" class="btn btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> 登录
            </a>

            <!-- 注册链接 -->
            <a href="register.html" class="btn btn-register">
                <i class="fa-solid fa-user-plus"></i> 注册账号
            </a>
        </div>
    </div>

</body>

</html>
